name: Deploy website to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Deploy the repository's actual default branch, whatever it is named.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/openings/package-lock.json
      - name: Read Pages URL configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix prototypes/openings
      - name: Check source and product data
        run: |
          npm run check
          npm test
      - name: Build main site and retained drafts for Pages
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify static routes and nested draft assets
        run: npm run test:hosting:static
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload built website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
